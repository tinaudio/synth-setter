# @package _global_

defaults:
  - _self_
  - datamodule: ??? # choose datamodule with `test_dataloader()` for evaluation
  - model: ???
  - logger: null
  - trainer: gpu
  - paths: default
  - extras: default
  - hydra: eval
  - callbacks: none
  # synth identity consumed by VST datamodules, models, and callbacks via
  # ${synth.param_spec_name}; VST experiments override it (e.g. `synth=surge_xt`)
  - synth: null
  # `render` before `experiment` (matching train.yaml/dataset.yaml): Hydra only
  # lets an experiment override groups declared ahead of it.
  - render: null
  # embedding-conditioning profiles pairing a stored Lance column with its
  # encoder settings on both the datamodule and the model (e.g. `conditioning=same_s`)
  - conditioning: null
  # sketch controls must compose identically for checkpoint train and eval.
  - sketch: null
  - experiment: null

task_name: "eval"
# The CLI sets this once before Hydra composition; DDP children inherit it.
eval_attempt_id: ${oc.env:SYNTH_SETTER_EVAL_ATTEMPT_ID,null}

tags: ["dev"]
# Integer IDs resolved through the runtime feature-flag registry.
feature_flags: []
mode: test
# Required explicitly when model.seeded_evaluation=true; ignored otherwise.
seed: null

# Predict-mode post-processing; gated off so `mode: test`/`validate` stay unchanged.
evaluation:
  render_vst: false
  compute_metrics: false
  rerender_target: true
  # Third-party corpora carry no ground-truth patch; set with rerender_target=false
  # so target audio comes from the dataset instead of a re-render.
  no_params: false
  num_workers: 1
  # Optional suite root; the CLI appends this invocation's UUID before upload.
  upload_output_dir_uri: null

# Local path or R2-backed r2:// / s3:// object URI.
ckpt_path: ???
# Optional SHA-256 pin for the checkpoint bytes.
ckpt_sha256: null

# W&B model lineage (storage-provenance-spec §5): the train config ID this eval consumes.
# Pin an immutable artifact version when the checkpoint itself is immutable.
consumed_train_artifact_alias: latest
consumed_train_config_id: null
# Dataset lineage is discovered from ``datamodule.dataset_root/input_spec.json``.
