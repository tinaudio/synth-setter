# Single-GPU RunPod pool for torchsynth arms. TorchSynth renders online, so no
# dataset is staged and the 750 GB training disk is unnecessary; 100 GB holds the
# image plus checkpoints. Single device is required by #2585.
name: runpod-torchsynth
resources:
  - cloud: runpod
    accelerators:
      RTX3090: 1
      RTX4090: 1
      A40: 1
    use_spot: false
    disk_size: 100
