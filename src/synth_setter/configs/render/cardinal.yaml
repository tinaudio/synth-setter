defaults:
  - vst
  - _self_

renderer_backend: dawdreamer
# DawDreamer's open_editor() blocks the main thread and exposes no close-event API.
gui_toggle_cadence: never
# Cardinal's Rack engine free-runs, so only a per-render instance is reproducible.
plugin_reload_cadence: render
# Silent engine callbacks per step; null keeps the 8-block preset settle only (#3245).
post_load_flush_blocks: null
post_param_flush_blocks: null
post_render_flush_blocks: null
