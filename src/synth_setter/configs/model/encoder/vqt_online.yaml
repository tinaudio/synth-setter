_target_: synth_setter.models.components.pretrained_encoder.PretrainedConditioningEncoder
out_dim: 512
backbone:
  _target_: synth_setter.models.components.vqt_encoder.VqtAudioEncoder
  sample_rate: ${oc.select:datamodule.sample_rate,44100}
  hop_length: 441
  fmin: 32.7
  n_bins: 256
  bins_per_octave: 32
  gamma: 20.0
  max_batch_size: 32
  pad_mode: reflect
head:
  _target_: synth_setter.models.components.embed_pool.EmbeddingPool
  embed_dim: ${model.encoder.backbone.n_bins}
  d_model: ${model.encoder.out_dim}
  num_heads: ${model.encoder_num_heads}
  n_conditioning_outputs: ${oc.select:model.vector_field.num_layers,1}
  pos_enc: sin
  max_seq_len: ${cqt_n_frames:${oc.select:datamodule.signal_length,176400},${oc.select:datamodule.sample_rate,44100}}
