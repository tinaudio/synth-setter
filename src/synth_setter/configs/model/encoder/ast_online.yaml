# The VST path's stored-mel AST, fed by a mel the model computes from the waveform.
# The backbone IS model/encoder/ast.yaml — only the mel's source and geometry differ, so
# the transformer's hyperparameters have one definition rather than a copy per path.
# Mono renders give one channel, unlike the stored two-channel column (#2751).
defaults:
  - /model/frontend@frontend: log_mel
  - /model/encoder@backbone: ast
  - _self_

_target_: synth_setter.models.components.spec_encoder.SpecEncoder
backbone:
  input_channels: 1
  spec_shape:
    - ${model.encoder.frontend.n_mels}
    - ${mel_n_frames:${datamodule.signal_length},${datamodule.sample_rate}}
