# Scores a sampled row against the batch's stored target audio through the differentiable
# torchsynth renderer (noise-aligned to the targets), so no target is re-rendered.
_target_: synth_setter.models.components.rendered_reward.RenderedAudioReward
sample_rate: ${datamodule.sample_rate}
signal_length: ${datamodule.signal_length}
# The renderer's voice is allocated once at this size; the sampled group renders in chunks.
render_batch_size: ${datamodule.batch_size}
distance:
  _target_: synth_setter.models.components.audio_distance.MultiScaleSpectralDistance
  sample_rate: ${datamodule.sample_rate}
