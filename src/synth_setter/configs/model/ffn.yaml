_target_: synth_setter.models.vst_ff_module.VSTFeedForwardModule

# Online-render synths have no stored mel column; the net observes the waveform and
# computes its own log-mel. See https://github.com/tinaudio/synth-setter/issues/2587.
conditioning: audio

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 1e-4
  weight_decay: 0.0

scheduler: null

net:
  _target_: synth_setter.models.components.residual_mlp.CNNResidualMLP
  in_dim: ${datamodule.signal_length}
  channels: 24
  encoder_blocks: 4
  trunk_blocks: 4
  hidden_dim: 384
  out_dim: ${datamodule.num_params}
  kernel_size: 7
  norm: bn

# compile model for faster training with pytorch 2.0
compile: true
