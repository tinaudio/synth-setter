# Real cepstrogram: quefrency rows are delay lengths in samples, so FDN delay lines show
# as spikes. 32768-point frames (743 ms at 44.1 kHz) resolve modes ~1.3 Hz apart; the
# 11025 hop keeps a coarse time axis so decay is read from frame levels and stays above
# the AST patch height under the #3160 padding swap. q_max covers
# the 400-1200 Householder delays plus their pair sums.
_target_: synth_setter.models.components.spec_encoder.CepstrogramFrontend
in_dim: ${datamodule.signal_length}
n_fft: 32768
hop_length: 11025
q_max: 2500
window: hamming
floor_db: 100.0
scale: 1.0
