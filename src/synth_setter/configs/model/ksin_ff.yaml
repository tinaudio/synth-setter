_target_: synth_setter.models.ksin_ff_module.KSinFeedForwardModule

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 1e-4
  weight_decay: 0.0

# T_max is epoch-denominated, so every consumer must pin trainer.max_epochs.
scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: ${trainer.max_epochs}
  eta_min: 1e-6
  last_epoch: -1

net:
  _target_: synth_setter.models.components.residual_mlp.SpectralResidualMLP
  in_dim: ${datamodule.signal_length}
  hidden_dim: 1024
  # Amplitude and frequency per partial.
  out_dim: ${mul:${datamodule.k},2}

loss_fn: mse

# The k-sinusoid target lays out k frequencies then k amplitudes; the module default
# of 3 splits that unevenly and the Chamfer metrics die on the stack.
params_per_token: 2

compile: false
