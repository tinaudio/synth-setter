# Distance in the frozen conditioning encoder's embedding space. Requires
# drop_last=True, model.compile=false and a single device — see
# https://github.com/tinaudio/synth-setter/issues/2585.
_target_: synth_setter.models.components.audio_feedback.AudioFeedbackLoss
lambda_audio: 0.03
t_min: 0.8
distance: latent
sample_rate: ${datamodule.sample_rate}
signal_length: ${datamodule.signal_length}
midi_pitch: ${datamodule.midi_pitch}
