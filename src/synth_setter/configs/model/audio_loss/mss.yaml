# MSS-dominant multichannel distance with MLDR dynamics and spatial sum/difference terms.
# These initial weights balance metric scales conservatively; they are not empirically optimal.
# Requires model.compile=false and a single device (#2585).
_target_: synth_setter.models.components.audio_feedback.AudioFeedbackLoss
lambda_audio: 0.03
t_min: 0.8
sample_rate: ${datamodule.sample_rate}
signal_length: ${datamodule.signal_length}
# The renderer's voice is allocated once at this size; shorter batches pad up to it.
render_batch_size: ${datamodule.batch_size}
distance:
  _target_: synth_setter.models.components.audio_distance.MultichannelAudioDistance
  sample_rate: ${datamodule.sample_rate}
  spectral_weight: 1.0
  channel_mldr_weight: 0.1
  pair_mldr_weight: 0.1
