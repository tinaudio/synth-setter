defaults:
  - model_checkpoint
  - lr_monitor
  # - early_stopping
  - model_summary
  - rich_progress_bar
  # - plot_loss
  - plot_proj
  - plot_projii
  - _self_

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}"
  # Every VST-family module logs val/param_mse; val/loss died with the torchsynth fork.
  monitor: "val/param_mse"
  mode: "min"
  save_last: True
  auto_insert_metric_name: False
