# @package _global_

# Concat sketch-control token conditioning (#2612): the datamodule reads the
# nested sketch struct column (#2707), reassembles it into the sketch_ctrl
# batch tensor (zero-binning pitch below the threshold, #2614), and the flow
# model injects zero-initialized control tokens into the vector field.
# Pre-pool at the model token boundary so hydration omits discarded frames.
model:
  sketch_controls:
    column: sketch
    num_frames: 32
    num_control_tokens: 32
    pitch_zero_threshold: 0.1
    # Sketch2Sound's 1-25 windows span up to 625 ms at 40 Hz; five frames
    # preserve that span on this four-second, 32-frame control grid.
    median_filter_max_kernel_size: 5

datamodule:
  sketch: ${model.sketch_controls}
