# @package _global_

# Explicit opt-in: extract music sketch controls from each transferred waveform.
model:
  sketch_controls:
    profile: music
    source: online
    sample_rate: ${datamodule.sample_rate}
    num_frames: 96
    num_control_tokens: 96
    temporal_resampling: average
    pitch_zero_threshold: 0.1
    # Opt-in augmentation (#3730); `median_filter_max_window_fraction=0.15625` is a five-token
    # window at 32 tokens and scales with this token grid.
    median_filter_max_window_fraction: null

datamodule:
  sketch: ${model.sketch_controls}
