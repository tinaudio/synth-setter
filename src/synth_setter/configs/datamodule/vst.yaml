_target_: synth_setter.data.lance_datamodule.LanceVSTDataModule
dataset_root: ${paths.output_dir}/data
# Hydrates as a projected column subset into a request-addressed subdirectory of
# dataset_root; the source must carry the train/val/test .lance split layout.
download_dataset_root_uri: null
use_saved_mean_and_variance: true
batch_size: 128
ot: true
conditioning: mel
# Per dataloader, so enabling validation doubles the live worker count. Sized
# against host RAM, not cores — see getting-started.md §8.
num_workers: 4
persistent_workers: true
# Null delegates prefetch depth to PyTorch; in-process loading ignores it.
prefetch_factor: null
predict_file: null
# Per-split {train/val/test: transaction-uuid} pins for projected rematerialization.
download_dataset_txids: null
# First-N rows per split; without txids, intended for disposable smoke/tuning runs.
download_dataset_row_limit: null
# Identity flows from the root synth group (#2565); selecting a VST datamodule
# without `synth=<name>` fails loudly at first resolution.
param_spec_name: ${synth.param_spec_name}
