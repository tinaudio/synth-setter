defaults:
  - /datamodule/third_party/base@_here_
  - _self_

# One mono/stereo rendering per space; B-format, example auralisations, anechoic, and turntable objects are skipped.
dataset_uri: r2://experiments/third_party/OpenAIR/all.lance
dataset_version: 1
audio_column: source_bytes
row_filter: "audio_decodable = true AND source_path LIKE 'IRs/%' AND (source_path LIKE '%/mono/%' OR source_path LIKE '%/stereo/%')"
downmix: true
peak_normalize: true
