defaults:
  - /datamodule/third_party/base@_here_
  - _self_

# The omnidirectional WAV responses; the SOFA array/binaural containers stay opaque.
# starts_with, not LIKE: LIKE treats the underscores in the prefix as wildcards.
dataset_uri: r2://experiments/third_party/THKoelnSRIR/all.lance
dataset_version: 1
audio_column: source_bytes
row_filter: "audio_decodable = true AND starts_with(source_path, 'Omni_ir_')"
downmix: true
peak_normalize: true
