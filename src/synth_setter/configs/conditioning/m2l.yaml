# @package _global_

# music2latent conditioning on the `m2l` column add_embeddings writes — not the
# `music2latent` column the bare `conditioning=m2l` legacy string maps to.
defaults:
  - override /model/encoder: embedpool

model:
  conditioning:
    column: m2l
    input_shape: [128, 42]
  encoder:
    d_model: ${oc.select:model.vector_field.d_model,${param_spec_width:${datamodule.param_spec_name}}}
    embed_dim: 128
    max_seq_len: 42
    num_heads: ${oc.select:model.vector_field.num_heads,1}

datamodule:
  conditioning:
    column: m2l
    input_shape: [128, 42]
