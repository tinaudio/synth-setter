# @package _global_

# TinyMU MATPAC conditioning from a four-second `tinymu` Lance sequence.
defaults:
  - override /model/encoder: embedpool

model:
  conditioning:
    column: tinymu
    input_shape: [3840, 25]
  encoder:
    embed_dim: ${model.conditioning.input_shape.0}
    max_seq_len: ${model.conditioning.input_shape.1}

datamodule:
  conditioning:
    column: tinymu
    input_shape: ${model.conditioning.input_shape}
