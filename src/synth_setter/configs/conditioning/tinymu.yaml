# @package _global_

# TinyMU MATPAC conditioning from a four-second `tinymu` Lance sequence.
defaults:
  - override /model/encoder: embedpool

model:
  conditioning:
    column: tinymu
    input_shape: [3840, 25]
  encoder:
    embed_dim: 3840
    max_seq_len: 25

datamodule:
  conditioning:
    column: tinymu
    input_shape: [3840, 25]
