# @package _global_

# Raw-audio conditioning through the AST over a real cepstrogram, the front end whose row
# axis is quefrency in samples, so delay-line lengths are read directly rather than
# inferred from blurred comb spacing (#3159).
defaults:
  - override /model/encoder: ast_cepstrum_online

datamodule:
  conditioning: audio

model:
  conditioning: audio
  vector_field:
    # The AST emits a token sequence, so conditioning width is the backbone's d_model.
    conditioning_dim: ${model.encoder.backbone.d_model}
