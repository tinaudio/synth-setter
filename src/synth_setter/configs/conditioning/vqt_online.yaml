# @package _global_

# Compute nnAudio2 VQT conditioning from raw waveforms inside the model.
defaults:
  - override /model/encoder: vqt_online

model:
  compile: false
  conditioning: audio
  encoder_output_dim: ${model.encoder.out_dim}
  vector_field:
    conditioning_dim: ${model.encoder.out_dim}

datamodule:
  conditioning: audio
