# @package _global_

# From-scratch PupuJEPA Large conditioning trains the teacher and pool jointly from waveforms.
defaults:
  - override /model/encoder: pupujepa_scratch

model:
  conditioning: audio
  encoder:
    backbone:
      variant: large
    head:
      embed_dim: 8192
  encoder_output_dim: ${model.encoder.out_dim}
  vector_field:
    conditioning_dim: ${model.encoder.out_dim}

datamodule:
  conditioning: audio
