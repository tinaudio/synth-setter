# Evaluate all canonical Simple 440k conditioning checkpoints and mode spellings
# sequentially in one attached managed job. Terminal state releases the worker;
# attached-mode cancellation is final cleanup and propagates the job result.
compute: runpod/training
tier: mid
worker_image_tag: devcontainer-tools
env_file: .env
job_name: eval-flow-simple-440k-all-modes
num_workers: 1
tail: true
cmd: >-
  cd /home/build/synth-setter &&
  bash scripts/sync_worker_checkout.sh &&
  exec src/synth_setter/scripts/run-linux-vst-headless.sh
  jobs/eval/run-flow-simple-440k-all-modes.sh --execute
