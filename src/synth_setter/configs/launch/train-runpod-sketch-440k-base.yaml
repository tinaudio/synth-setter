# RunPod launch for the base arm of the 440k sketch A/B.
#
# The surge/flow_sketch_440k_base experiment owns the dataset pin, seed, anneal
# horizon, and loader shape; the cmd carries only experiment selection and
# operational flags, so the two arms cannot drift through launch overrides.

compute: runpod/training-h100
worker_image_tag: devcontainer-tools
env_file: .env
# Detach after SkyPilot accepts the launch so GitHub Actions does not wait for training.
tail: false
cmd: >-
  cd /home/build/synth-setter &&
  bash scripts/sync_worker_checkout.sh &&
  exec synth-setter-train
  experiment=surge/flow_sketch_440k_base
  hydra.run.dir=/home/build/synth-setter/train-run
