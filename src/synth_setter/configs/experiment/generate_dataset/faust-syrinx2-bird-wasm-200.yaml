# @package _global_

# Local WASM validation dataset for the autonomous syrinx2-bird avian-phonation model.
defaults:
  - override /datamodule: vst
  - override /synth: faust_syrinx2_bird
  - override /render: faustwasm
  - _self_

task_name: faust-syrinx2-bird-wasm-200

train_val_test_sizes: [200, 0, 0]
mask_degenerate_bins: true
finalize_inline: true

render:
  channels: 1
  samples_per_render_batch: 1
  samples_per_shard: 200
