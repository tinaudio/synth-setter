# @package _global_

defaults:
  - override /datamodule: vst
  - override /synth: faust_shimmer_fdn
  - override /render: faust
  - _self_

task_name: faust-shimmer-fdn-lance-50k
output_format: lance
train_val_test_sizes: [50000, 0, 0]

render:
  # A single impulse has much lower integrated loudness than sustained notes.
  min_loudness: -70.0
  samples_per_shard: 10000

r2:
  bucket: experiments
