# @package _global_

# GPU smoke test for VST FFN against a finalized Surge XT Lance R2 root.

defaults:
  - /experiment/surge/ffn_full
  - _self_

experiment_name: surge-smoke-fixture
run_name: ffn

model:
  # vst_ff_module.setup() recompiles net on every stage; with fit + test that
  # double-compiles and raises. Smoke runs don't need the compiled path anyway.
  compile: false

datamodule:
  # Projected-subset hydrated by prepare_data() before fit; opt-in R2 source.
  download_dataset_root_uri: r2://experiments/data/surge-xt-lance-1k-2k-2k/surge-xt-lance-1k-2k-2k-20260717T042205119Z/
  # Caps the 1k-row train split so a smoke run hydrates in seconds.
  download_dataset_row_limit: 64
  batch_size: 4
  # Single-process loading for the row-capped subset, matching surge/test*.yaml.
  num_workers: 0

trainer:
  max_steps: 10
  # Smoke run: drop the surge-default 1M floor so the run stops at max_steps.
  min_steps: null
