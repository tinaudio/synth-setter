# @package _global_

# Pins the published model-<id> W&B artifact as ckpt_path. Kept out of the shared surge/<id>
# config so train.yaml never resumes from (or eagerly resolves) the artifact; eval/predict
# launchers compose this overlay to source the checkpoint.
defaults:
  - /experiment/surge/ffn_full
  - _self_

ckpt_path: ${wandb:tinaudio/synth-setter/model-ffn_full:latest}

model:
  # Pinned like ``d_out``: predict jobs pair this checkpoint with audio datamodules that
  # declare no ``param_spec_name``, so the width cannot be read from the datamodule (#2558).
  encoder_output_dim: ${param_spec_width:surge_xt}
  net:
    d_out: ${param_spec_width:surge_xt}

callbacks:
  log_per_param_mse:
    param_spec: surge_xt
