# @package _global_

# Reinforce Adjoint Matching post-training (arXiv 2605.10759) of a pretrained surge_simple
# flow toward the multi-scale spectral reward, with both sample and target re-rendered
# in-process through surgepy. Requires a single device and
# model.base_checkpoint=<path> naming the pretrained flow to post-train.
defaults:
  - /experiment/surge/flow_simple
  - override /model: vst_flow_ram
  - override /model/reward: synth
  - override /render: surgepy
  - override /synth: surge_simple_surgepy
  - _self_

run_name: flow_ram

# Each row fans out into num_samples_per_row surgepy renders plus one target render.
datamodule:
  batch_size: 8

callbacks:
  model_checkpoint:
    every_n_train_steps: ${trainer.val_check_interval}

# The step budget lives here so `experiment=` alone reproduces the run.
trainer:
  max_steps: 2000
  min_steps: 2000
  val_check_interval: 200
  # The renderer graph-breaks under compile and the RAM loss is scored in fp32 (#2585).
  precision: 32-true
