# @package _global_

defaults:
  - override /datamodule: pyfdn
  - override /synth: pyfdn_n8_mono_householder
  - override /render: pyfdn
  - override /model: vst_flow
  - override /conditioning: ast_online
  - override /callbacks: [default, log_per_param_mse]
  - override /trainer: gpu_400k_steps
  - _self_

experiment_name: pyfdn
run_name: flow-ast-online
tags: [pyfdn, flow, ast-online]

model:
  compile: false
  encoder:
    frontend:
      in_dim: 176_400
      sample_rate: 44_100
    backbone:
      spec_shape: [128, 401]

callbacks:
  model_checkpoint:
    monitor: val/param_mse
  early_stopping: null

trainer:
  val_check_interval: 2000
  limit_val_batches: 20

training:
  val_audio_probe: true
