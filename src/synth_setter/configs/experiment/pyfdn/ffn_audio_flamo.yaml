# @package _global_

defaults:
  - override /datamodule: pyfdn
  - override /synth: pyfdn_n8_mono_householder
  - override /render: pyfdn
  - override /model: vst_ffn
  - override /model/audio_loss: mss
  - override /callbacks: [default, log_per_param_mse]
  - override /trainer: gpu_400k_steps
  - _self_

experiment_name: pyfdn
run_name: ffn_audio_flamo
tags: [pyfdn, ffn, audio_feedback, flamo]

datamodule:
  include_audio: true

model:
  compile: false
  net:
    input_channels: 1
  audio_loss:
    sample_rate: 44100
    signal_length: 176400
    distance:
      sample_rate: ${..sample_rate}
    renderer:
      _target_: synth_setter.models.components.differentiable_renderer.FlamoFDNDifferentiableRenderer.from_param_spec
      param_spec: ${synth.param_spec_name}
      sample_rate: ${..sample_rate}
      signal_length: ${..signal_length}

callbacks:
  model_checkpoint:
    monitor: val/param_mse
  early_stopping: null

trainer:
  val_check_interval: 2000
  limit_val_batches: 20

training:
  val_audio_probe: true
