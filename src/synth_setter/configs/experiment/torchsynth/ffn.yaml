# @package _global_

defaults:
  - override /datamodule: torchsynth
  - override /synth: torchsynth_full
  - override /render: torchsynth
  - override /model: ffn
  - override /callbacks: default
  - override /trainer: gpu
  - _self_

experiment_name: torchsynth
run_name: ffn
tags: [torchsynth]

# val/loss has a high irreducible floor (near-inaudible params), so the audio-domain
# signal is what reflects inversion quality (PR #1810). That signal now comes from the
# val-audio probe rather than an in-module val/lsd; the checkpoint monitor tracks
# val/param_mse because probe metrics arrive a validation late and can be skipped.
callbacks:
  model_checkpoint:
    monitor: val/param_mse
  early_stopping: null

# The probe renders predictions off-loop for audio metrics; it needs both a render
# group and the root synth identity.
training:
  val_audio_probe: auto

# Fresh train rows each epoch: E2 vs E5 in the PR #1810 log show the fixed split
# memorizes (val rises past the 0.0833 prior) while resampling crosses below it.
datamodule:
  resample_train_per_epoch: true

model:
  compile: false
  net:
    amin: 1.0e-10
    center: true
    f_max: null
    f_min: 0.0
    _target_: synth_setter.models.components.residual_mlp.LogMelCNNResidualMLP
    in_dim: ${datamodule.signal_length}
    mel_norm: slaney
    mel_scale: slaney
    n_mels: 128
    out_dim: ${datamodule.num_params}
    pad_mode: constant
    power: 2.0
    sample_rate: ${datamodule.sample_rate}
    top_db: 80.0
    window: hamming
