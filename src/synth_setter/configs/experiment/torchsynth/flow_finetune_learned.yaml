# @package _global_

# Equation 10: a trainable encoder reads the render-minus-target residual, so neither the
# simulator nor the cost need be differentiable. Swap the control representation with
# `model/encoder@model.control_encoder=<member>`.
# Inherits torchsynth/flow rather than torchsynth/flow_finetune: a sibling experiment's own
# defaults resolve against its directory, so chaining two levels looks for torchsynth/torchsynth.
defaults:
  - torchsynth/flow
  - override /model: vst_flow_finetune
  - override /model/encoder@model.control_encoder: log_mel
  - _self_

run_name: flow_finetune_learned
tags: [torchsynth, flow, finetune, simulator_feedback, learned_audio]

model:
  control_mode: learned_audio
  # The learned arm scores through its encoder, so no differentiable cost is used.
  cost: null
