# @package _global_

# Condition and score in frozen SAME-S latents so both paths share one representation.
# Requires model.compile=false and a single device — see
# https://github.com/tinaudio/synth-setter/issues/2585.
defaults:
  - torchsynth/flow
  - override /conditioning: same_s_online
  - override /model/audio_loss: same
  - _self_

run_name: flow_audio_same
tags: [torchsynth, flow, audio_loss, same]
