name: Install rclone
description: Install the repository-pinned rclone binary on Ubuntu amd64 runners.

runs:
  using: composite
  steps:
    # Pin rclone because Ubuntu's 1.60.1 fails its first R2 write (#1817).
    # amd64-only; update version and SHA256SUMS digest together.
    - name: Install pinned rclone
      shell: bash
      env:
        PINNED_RCLONE_VERSION: "1.68.2"
        PINNED_RCLONE_SHA256: "0e6fa18051e67fc600d803a2dcb10ddedb092247fc6eee61be97f64ec080a13c"
      run: |
        set -euo pipefail
        tmp="$(mktemp -d)"
        trap 'rm -rf "${tmp}"' EXIT
        release="rclone-v${PINNED_RCLONE_VERSION}-linux-amd64"
        curl -fsSL --retry 3 -o "${tmp}/rclone.zip" \
          "https://downloads.rclone.org/v${PINNED_RCLONE_VERSION}/${release}.zip"
        echo "${PINNED_RCLONE_SHA256}  ${tmp}/rclone.zip" | sha256sum -c -
        unzip -q "${tmp}/rclone.zip" -d "${tmp}"
        sudo install -m 0755 "${tmp}/${release}/rclone" /usr/local/bin/rclone
        installed="$(rclone version | sed -n 1p)"
        echo "${installed}"
        [[ "${installed}" == "rclone v${PINNED_RCLONE_VERSION}" ]]
