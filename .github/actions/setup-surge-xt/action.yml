name: Set up Surge XT
description: >-
  Install the pinned Surge XT package through Studiorack and link its VST3
  bundle into `plugins/` where synth-setter render configs resolve it.

runs:
  using: composite
  steps:
    - name: Install Surge XT with Studiorack
      shell: bash
      run: |
        set -euo pipefail
        managed_dir="/Library/Application Support/synth-setter/studiorack"
        npm ci
        sudo -E env "PATH=${PATH}" "CI=" \
          "STUDIORACK_PLUGINS_DIR=${managed_dir}" \
          uv run synth-setter-plugins install --plugin surge-synthesizer/surge
        sudo chown -R "$(id -u):$(id -g)" "${managed_dir}"
