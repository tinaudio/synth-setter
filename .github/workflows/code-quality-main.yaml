# All-files hooks for main and PRs that change global lint infrastructure (#2458).

name: Code Quality Main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - ".github/actions/setup-precommit/**"
      - ".editorconfig"
      - ".github/workflows/code-quality-main.yaml"
      - ".gitlint"
      - ".pre-commit-config.yaml"
      - ".pydoclint-baseline.txt"
      - "agent/hooks/**"
      - "checkmake.ini"
      - "Makefile"
      - "pyproject.toml"
      - "pyrightconfig.json"
      - "scripts/check_no_new_funcs_in_pydoclint_excluded.py"
      - "scripts/ci/count_doc_noqa.sh"
      - "scripts/ci/pr_body_lint.py"
      - "tests/infra/test_deep_premerge_workflows.py"
      - "tests/scripts/test_check_no_new_funcs_in_pydoclint_excluded.py"
      - "uv.lock"

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pre-commit toolchain
        uses: ./.github/actions/setup-precommit

      # `pre-commit/action@v3` shells out to `python -m pip install pre-commit`
      # against whichever python is first on PATH; with `uv sync` putting
      # `.venv/bin/python` on PATH that python has no pip and the action dies
      # with "No module named pip". Run pre-commit straight from the venv
      # through `uv run` instead — pre-commit is in the dev group.
      - name: Run pre-commits
        env:
          # Main pushes skip the branch guard; PR merge refs still run it.
          SKIP: ${{ github.event_name == 'push' && 'no-commit-to-branch' || '' }}
        run: uv run pre-commit run --all-files
