name: Mutation Testing

# Mutation testing is slow and noisy; run on demand or weekly, never on every PR.
# This workflow exists primarily as a Level-1 verification gate for the
# `[tool.mutmut]` configuration — it proves the mutmut sandbox imports resolve
# and that `mutmut run` actually completes end-to-end. The end-to-end completion
# is *not* possible on macOS (Apple's fork-safety + heavy C-extension imports in
# tests/conftest.py — torch, hydra — cause SIGSEGV in forked children).
# On ubuntu-latest, os.fork() works cleanly.

on:
  workflow_dispatch:
  schedule:
    # Sundays at 09:00 UTC — once a week is enough for a slow-changing config
    # whose own pre-merge gate is the CI test suite (test.yml).
    - cron: "0 9 * * 0"

permissions:
  contents: read

jobs:
  mutmut_run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: evaluation-audio
            pattern: synth_setter.evaluation.a*
          - name: evaluation-metrics
            pattern: synth_setter.evaluation.compute_audio_metrics.*
          - name: evaluation-predict
            pattern: synth_setter.evaluation.predict_vst_audio.*
          - name: evaluation-shuffle
            pattern: synth_setter.evaluation.shuffle_pred_audio.*
          - name: tools
            pattern: synth_setter.tools.*
          - name: pipeline-add-public
            pattern: synth_setter.pipeline.data.add_*.x_[!_]*
          - name: pipeline-add-private-a-m
            pattern: synth_setter.pipeline.data.add_*.x__[a-m]*
          - name: pipeline-add-private-n-z
            pattern: synth_setter.pipeline.data.add_*.x__[n-z]*
          - name: pipeline-lance
            pattern: synth_setter.pipeline.data.lance_*
          - name: pipeline-t5gemma
            pattern: synth_setter.pipeline.data.t5gemma.*
          - name: pipeline-stats
            pattern: synth_setter.pipeline.data.stats.*
          - name: pipeline-finalize
            pattern: synth_setter.pipeline.data.finalize_progress.*
          - name: ci-scripts
            pattern: scripts.ci.*

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # tomllib avoids mutmut's legacy TOML parser failure on PEP 735 groups — see #1414.
      - name: Set up Python 3.12.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true

      # Frozen sync, CPU torch via [tool.uv.sources] — see test.yml for rationale.
      - name: Install dependencies (uv sync --frozen, CPU torch)
        run: uv sync --frozen --extra cpu --no-default-groups --group dev

      - name: Run mutmut
        env:
          HYDRA_FULL_ERROR: "1"
        run: uv run mutmut run --max-children 4 "${{ matrix.pattern }}"

      - name: Print results
        if: always()
        run: uv run mutmut results

      - name: Upload mutants/ artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-${{ matrix.name }}-mutants
          path: mutants/
          retention-days: 14
          if-no-files-found: warn
