name: Train

# Manually-dispatched training: the experiment owns the dataset pin and
# scientific knobs; the reusable compute profile owns infrastructure. The
# runner invokes the Hydra-native generic launcher in the dev-snapshot image
# and detaches after the managed-jobs controller accepts the job.
# WORKER_GIT_REF pins the worker checkout to the dispatched SHA so §12
# github_sha provenance records the commit actually trained.
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: "Hydra experiment to train (e.g. surge/flow_simple_440k); must be self-contained"
        required: true
        type: string
      compute:
        description: "Expert override: skypilot_launch/compute option (empty selects by experiment)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  train:
    name: Dispatch synth-setter-train via SkyPilot (${{ inputs.experiment }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: tinaudio/synth-setter:dev-snapshot
      EXPERIMENT: ${{ inputs.experiment }}
      COMPUTE_INPUT: ${{ inputs.compute }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The full dataset needs the 750 GB training pool; other experiments use
      # the cheap smoke pool unless the operator explicitly selects a profile.
      - name: Resolve compute option
        run: |
          set -euo pipefail
          if [ -n "$COMPUTE_INPUT" ]; then
            COMPUTE_OPTION="$COMPUTE_INPUT"
          else
            case "$EXPERIMENT" in
              surge/flow_simple_440k)
                COMPUTE_OPTION=runpod/training
                ;;
              *)
                COMPUTE_OPTION=runpod/smoke
                ;;
            esac
          fi
          if [[ ! "$EXPERIMENT" =~ ^[A-Za-z0-9_./-]+$ ]]; then
            echo "::error::experiment contains unsupported shell characters"
            exit 1
          fi
          if [[ ! "$COMPUTE_OPTION" =~ ^[A-Za-z0-9_./-]+$ ]]; then
            echo "::error::compute contains unsupported shell characters"
            exit 1
          fi
          echo "Resolved compute option: $COMPUTE_OPTION"
          echo "COMPUTE_OPTION=$COMPUTE_OPTION" >> "$GITHUB_ENV"

      # Exports canonical storage env plus the rclone projection for the container
      # env pass-through below; rclone itself runs on the SkyPilot worker, not the runner.
      - name: Set up R2
        uses: ./.github/actions/setup-r2
        with:
          access-key-id: ${{ secrets.RCLONE_CONFIG_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.RCLONE_CONFIG_R2_SECRET_ACCESS_KEY }}
          endpoint: ${{ secrets.RCLONE_CONFIG_R2_ENDPOINT }}

      - name: Pull image
        run: docker pull "$IMAGE"

      # python -m uses the mounted checkout rather than image-baked shims.
      - name: Dispatch via SkyPilot
        env:
          SKYPILOT_API_SERVER_ENDPOINT: ${{ secrets.SKYPILOT_API_SERVER_ENDPOINT }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WORKER_GIT_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/home/build/synth-setter" \
            -e SKYPILOT_API_SERVER_ENDPOINT \
            -e RUNPOD_API_KEY \
            -e SYNTH_SETTER_STORAGE_PROVIDER \
            -e SYNTH_SETTER_STORAGE_ACCESS_KEY_ID \
            -e SYNTH_SETTER_STORAGE_SECRET_ACCESS_KEY \
            -e SYNTH_SETTER_STORAGE_ENDPOINT_URL \
            -e RCLONE_CONFIG_R2_TYPE \
            -e RCLONE_CONFIG_R2_PROVIDER \
            -e RCLONE_CONFIG_R2_ACCESS_KEY_ID \
            -e RCLONE_CONFIG_R2_SECRET_ACCESS_KEY \
            -e RCLONE_CONFIG_R2_ENDPOINT \
            -e WANDB_API_KEY \
            -e WORKER_GIT_REF \
            -e COMPUTE_OPTION \
            -e EXPERIMENT \
            "$IMAGE" \
            bash -c '
              set -euo pipefail
              cd /home/build/synth-setter
              python -m synth_setter.pipeline.skypilot_launch \
                "skypilot_launch/compute=$COMPUTE_OPTION" \
                "skypilot_launch.cmd=\"exec synth-setter-train experiment=$EXPERIMENT training.upload_checkpoints_during_training=true hydra.run.dir=/home/build/synth-setter/train-run\""
            ' 2>&1 | tee train-dispatch.log

      - name: Upload dispatch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-dispatch-log
          path: train-dispatch.log
          if-no-files-found: warn
          retention-days: 7
