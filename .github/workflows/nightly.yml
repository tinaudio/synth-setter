name: Nightly Tests

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  # npm audit queries the registry, so it lives on a scheduled lane: a registry
  # blip or a newly published advisory must not red a merge-gating lane (#3634).
  npm-advisories:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        lockfile-dir:
          - .
          - scripts/faustwasm/browser
          - src/synth_setter/web

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      # Audits package-lock.json directly; no install, so a patched node_modules
      # cannot change the verdict.
      - name: Audit the checked-in npm lockfile
        id: audit
        working-directory: ${{ matrix.lockfile-dir }}
        run: npm audit --audit-level=high

      # Scoped to the audit step so a checkout or setup failure is not reported
      # as an advisory. The annotation carries the remediation; the audit's own
      # output does not.
      - name: Notify on advisories
        if: failure() && steps.audit.conclusion == 'failure'
        run: |
          echo "::error::npm audit reports a high-severity advisory in ${{ matrix.lockfile-dir }}. Run 'npm audit fix' there and check in the lockfile."

  nightly-full-suite:
    runs-on: ubuntu-latest

    # Must outlast `make test-ci-nightly`'s own 4800 s session budget, or the
    # runner cancels the job before pytest can report a verdict — #3653.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Pinned image: the floating binfmt:latest rolled to qemu v10.2.x, whose
      # user-mode emulation segfaults in dpkg's libc-bin configure step. Refs #2577.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
          image: docker.io/tonistiigi/binfmt:qemu-v9.2.2

      - name: Set up Python 3.12.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"

      # A repo-scoped uv cache serves every image unless the key names one, and the env
      # context cannot see the runner's own ImageOS — so republish it first (#3507, #3688).
      - name: Publish the runner image id
        run: echo "RUNNER_IMAGE_OS=${ImageOS:-unknown}" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
          cache-suffix: ${{ env.RUNNER_IMAGE_OS }}

      # Frozen sync, CPU torch via [tool.uv.sources] — see test.yml for rationale.
      - name: Install dependencies (uv sync --frozen, CPU torch)
        run: uv sync --frozen --extra cpu --no-default-groups --group dev

      - name: List dependencies
        run: uv pip list --python .venv/bin/python

      # File-URI hydration tests need only the binary; the nightly suite never
      # configures the R2 remote or receives storage credentials.
      - name: Install rclone
        uses: ./.github/actions/install-rclone

      # ubuntu-latest has no CUDA/MPS device and no Surge XT VST3; gpu/mps/
      # requires_vst suites run on dev-snapshot via sibling workflows — see #1279.
      # Marker filter lives in `make test-ci-nightly` — see #1353.
      - name: Run full test suite
        env:
          HYDRA_FULL_ERROR: "1"
        run: make test-ci-nightly

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Nightly test suite failed. Review the logs above for details."
