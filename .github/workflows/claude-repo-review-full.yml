name: Pi Repo Review (Full)

"on":
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: pi-repo-review-full-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repo-review-full:
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'ktinubu' &&
      github.actor == 'ktinubu' &&
      github.triggering_actor == 'ktinubu' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout review skills
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tinaudio/skills
          ref: 893eb09fd364093ede46cda4892aa80e0be43a63
          token: ${{ secrets.GIT_PAT }}
          path: .review-skills
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: 0.11.28
          enable-cache: false

      - name: Configure Pi authentication
        env:
          PI_AUTH_JSON: ${{ secrets.PI_AUTH_JSON }}
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
        run: |
          set -euo pipefail
          install -d -m 700 "${PI_CODING_AGENT_DIR}"
          install -m 600 /dev/null "${PI_CODING_AGENT_DIR}/auth.json"
          printf '%s' "${PI_AUTH_JSON}" > "${PI_CODING_AGENT_DIR}/auth.json"

      - name: Install Pi review runtime
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts @earendil-works/pi-coding-agent@0.83.0
          pi install npm:@tintinweb/pi-subagents@0.14.1
          uv python install 3.12.13
          uv venv --python 3.12.13
          uv pip install --python .venv/bin/python pydantic==2.13.4 sh==2.2.2

      - name: Run Pi repo-review-full
        env:
          CI: "true"
          GH_TOKEN: ${{ github.token }}
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
          PI_REVIEW_SKILLS_ROOT: ${{ github.workspace }}/.review-skills/codex/synth-setter-skills
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash agent/_shared/run_pi_review.sh repo-review-full --target "${PR_NUMBER}"

      - name: Upload Pi review audit
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pi-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agent-reviews/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
