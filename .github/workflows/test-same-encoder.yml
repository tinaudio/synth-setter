# Real-weight SAME-S/SAME-L parity against legacy stable-audio-tools references.
# Immutable public HF revisions are cached per model and run sequentially on CPU.
name: SAME Encoder E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths:
      - "src/synth_setter/pipeline/data/add_embeddings.py"
      - "src/synth_setter/same.py"
      - "src/synth_setter/models/components/same_encoder.py"
      - "tests/conftest.py"
      - "tests/helpers/same_reference.py"
      - "tests/pipeline/data/test_same_encoder_e2e.py"
      - "tests/models/test_same_encoder.py"
      - "tests/pipeline/data/generate_same_legacy_reference.py"
      - "tests/fixtures/same/**"
      - "pyproject.toml"
      - "uv.lock"
      - "codecov.yml"
      - ".github/workflows/test-same-encoder.yml"
  pull_request:
    paths:
      - "src/synth_setter/pipeline/data/add_embeddings.py"
      - "src/synth_setter/same.py"
      - "src/synth_setter/models/components/same_encoder.py"
      - "tests/conftest.py"
      - "tests/helpers/same_reference.py"
      - "tests/pipeline/data/test_same_encoder_e2e.py"
      - "tests/models/test_same_encoder.py"
      - "tests/pipeline/data/generate_same_legacy_reference.py"
      - "tests/fixtures/same/**"
      - "pyproject.toml"
      - "uv.lock"
      - "codecov.yml"
      - ".github/workflows/test-same-encoder.yml"

concurrency:
  group: same-encoder-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  same_encoder_e2e:
    name: ${{ matrix.model }} SA3 parity
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        model: [same_s, same_l]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv and Python 3.12.13
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.28"
          enable-cache: true
          python-version: "3.12.13"

      # Install the normal CPU heavy runtime; Stable Audio 3 belongs to its torch group.
      - name: Install dependencies (uv sync --frozen, CPU torch)
        run: uv sync --frozen --extra cpu --no-default-groups --group dev

      # Keep each immutable checkpoint cache independent so either model can rerun alone.
      - name: Cache ${{ matrix.model }} weights
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ matrix.model }}-${{ hashFiles('tests/helpers/same_reference.py') }}

      - name: Run ${{ matrix.model }} parity (real weights, CPU)
        env:
          PYTEST_SESSION_BUDGET_SECONDS: "2400"
        run: |
          uv run --no-sync pytest \
            -m same_e2e \
            tests/pipeline/data/test_same_encoder_e2e.py \
            tests/models/test_same_encoder.py \
            -k "${{ matrix.model }}" \
            -vv \
            --cov=src \
            --cov-branch \
            --cov-report=xml

      - name: Upload coverage to Codecov
        if: always() && hashFiles('coverage.xml') != ''
        uses: ./.github/actions/upload-coverage
        with:
          flags: same-e2e
          token: ${{ secrets.CODECOV_TOKEN }}
