name: GPU Tests

# Dispatches the production CUDA and VST path through SkyPilot — see #2460.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1,4" # Mon + Thu 06:00 UTC

permissions:
  contents: read

concurrency:
  group: test-gpu-${{ github.ref }}
  cancel-in-progress: false

env:
  COVERAGE_KEY: ci/gpu/${{ github.run_id }}/${{ github.run_attempt }}/coverage.xml
  LAUNCH_CONFIG: src/synth_setter/configs/launch/gpu-tests-runpod.yaml
  R2_BUCKET: intermediate-data

jobs:
  run_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      - name: Set up R2
        uses: ./.github/actions/setup-r2
        with:
          access-key-id: ${{ secrets.RCLONE_CONFIG_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.RCLONE_CONFIG_R2_SECRET_ACCESS_KEY }}
          endpoint: ${{ secrets.RCLONE_CONFIG_R2_ENDPOINT }}
          install-rclone: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.12.13"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install SkyPilot dependencies
        run: uv sync --frozen --extra cpu --no-default-groups --group dev

      # The launcher runs cred bootstrap and the RunPod balance preflight itself,
      # then tails the managed job so this step's exit code is the worker's.
      - name: Dispatch GPU tests via SkyPilot
        id: launch
        timeout-minutes: 105
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          SKYPILOT_API_SERVER_ENDPOINT: ${{ secrets.SKYPILOT_API_SERVER_ENDPOINT }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WORKER_GIT_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          uv run python -m synth_setter.pipeline.skypilot_launch "$LAUNCH_CONFIG" \
            --extra-env COVERAGE_KEY "$COVERAGE_KEY" \
            --extra-env R2_BUCKET "$R2_BUCKET" \
            --extra-env WANDB_API_KEY "$WANDB_API_KEY"

      # moveto, not copyto: retrieving the run-scoped object also cleans it up,
      # so a skipped cleanup step can never leak coverage blobs into R2.
      - name: Retrieve remote coverage
        if: always()
        env:
          LAUNCH_OUTCOME: ${{ steps.launch.outcome }}
        run: |
          set -euo pipefail
          remote="r2:${R2_BUCKET}/${COVERAGE_KEY}"
          if rclone moveto "$remote" coverage.xml --checksum && [[ -s coverage.xml ]]; then
            echo "Retrieved remote coverage.xml"
          elif [[ "$LAUNCH_OUTCOME" == "success" ]]; then
            echo "::error::GPU worker succeeded without a retrievable coverage.xml"
            exit 1
          else
            echo "No partial coverage artifact was produced before the worker failed"
          fi

      - name: Upload coverage to Codecov
        if: always() && hashFiles('coverage.xml') != ''
        uses: ./.github/actions/upload-coverage
        with:
          flags: unit-gpu
          token: ${{ secrets.CODECOV_TOKEN }}
