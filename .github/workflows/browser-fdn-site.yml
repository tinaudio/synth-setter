name: Browser pyFDN site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/browser-fdn-site.yml"
      - "src/synth_setter/web/fdn/**"
      - "src/synth_setter/faustwasm/**"
      - "src/synth_setter/data/vst/faust_sources.py"

permissions:
  contents: read

concurrency:
  group: browser-fdn-site-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same content-addressed bundle the e2e workflow validates.
  BUNDLE_SHA256: "b86aa3474cb86311615c5c01ede0a35e6445982052979dbe11649f6717f98f2d"

jobs:
  build-site:
    name: Build the static evaluation site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Install CPU dependencies
        run: uv sync --frozen --python 3.12.13 --extra cpu --no-default-groups --group dev
      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/synth_setter/web/package-lock.json
      - name: Install browser dependencies
        run: npm ci --prefix src/synth_setter/web
      - name: Configure real R2 artifacts
        uses: ./.github/actions/setup-r2
        with:
          access-key-id: ${{ secrets.RCLONE_CONFIG_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.RCLONE_CONFIG_R2_SECRET_ACCESS_KEY }}
          endpoint: ${{ secrets.RCLONE_CONFIG_R2_ENDPOINT }}
          install-rclone: "true"
      - name: Fetch the exported model bundle
        run: |
          mkdir -p build
          rclone copy --checksum "r2:experiments/browser-fdn/${BUNDLE_SHA256}" build/fdn-bundle
          echo "${BUNDLE_SHA256}  build/fdn-bundle/manifest.json" | sha256sum --check
      - name: Export the Faust FDN artifact
        run: uv run --extra cpu python -m synth_setter.tools.export_faustwasm --synth faust_fdn_n8_mono_householder --output build/fdn-faust
      - name: Assemble the site
        run: node src/synth_setter/web/fdn/export-site.mjs --model build/fdn-bundle --faust build/fdn-faust --output build/fdn-site
      - name: Upload the site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-fdn-site
          retention-days: 30
          path: build/fdn-site
