name: Test Spec Materialization

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag"
        required: false
        default: "dev-snapshot"
  pull_request:
    paths:
      - ".github/workflows/spec-materialization.yml"
      - ".github/workflows/test-spec-materialization.yml"
      - "docker/ubuntu22_04/ensure_plugin_symlinks.sh"
      - "pyproject.toml"
      - "src/synth_setter/cli/generate_dataset.py"
      - "src/synth_setter/configs/dataset.yaml"
      - "src/synth_setter/configs/experiment/generate_dataset/ci-materialize-test.yaml"
      - "src/synth_setter/pipeline/ci/materialize_spec.py"
      - "src/synth_setter/pipeline/ci/validate_spec.py"
      - "src/synth_setter/pipeline/schemas/**"
      - "src/synth_setter/plugin_manager.py"
      - "src/synth_setter/scripts/run-linux-vst-headless.sh"
      - "studiorack.json"
      - "tests/infra/test_deep_premerge_workflows.py"
      - "tests/pipeline/ci_config/test_materialize_spec.py"
      - "tests/test_plugin_manager.py"
      - "uv.lock"

permissions:
  contents: read

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/spec-materialization.yml
    with:
      image_tag: ${{ inputs.image_tag }}
      experiment: generate_dataset/ci-materialize-test
      artifact_name: test-materialized-spec
    secrets: inherit

  validate-test-config:
    needs: materialize
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"

      # `pip install -e .` installs the project + its light base only — pip
      # never installs PEP 735 dependency-groups, so the heavy runtime stays
      # out (see #1139).
      - name: Install synth_setter (light base provides validate_spec deps)
        run: pip install -e .

      # Fail fast if a new top-level import on the validate_spec path needs a dep
      # the light base doesn't carry (it would otherwise surface mid-run).
      - name: Import smoke-guard for validate_spec
        run: python3 -c "from synth_setter.pipeline.ci.validate_spec import main"

      - name: Download spec artifact
        uses: actions/download-artifact@v4
        with:
          name: test-materialized-spec

      - name: Assert test-specific values
        run: python3 -m synth_setter.pipeline.ci.validate_spec input_spec.json --test-values

  materialize-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPERIMENT: generate_dataset/ci-materialize-test
      IMAGE: tinaudio/synth-setter:dev-snapshot
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"

      - name: Install synth_setter for spec validation
        run: pip install -e .

      - name: Pull image
        run: docker pull "${IMAGE}"

      - name: Materialize spec locally in Docker
        run: |
          set -euo pipefail
          mkdir -p /tmp/spec-output
          docker run --rm \
            -v "${{ github.workspace }}:/home/build/synth-setter" \
            -v /tmp/spec-output:/spec-output \
            -e EXPERIMENT \
            "${IMAGE}" \
            bash -c '
              set -euo pipefail
              cd /home/build/synth-setter
              git config --global --add safe.directory /home/build/synth-setter
              bash docker/ubuntu22_04/ensure_plugin_symlinks.sh
              src/synth_setter/scripts/run-linux-vst-headless.sh \
                python -m synth_setter.pipeline.ci.materialize_spec \
                "$EXPERIMENT" /spec-output
            '

      - name: Validate local spec
        run: >-
          python3 -m synth_setter.pipeline.ci.validate_spec
          /tmp/spec-output/input_spec.json --test-values
