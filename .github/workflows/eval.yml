name: Evaluate

# Dispatch headless evaluation through the generic Hydra SkyPilot launcher.
# WORKER_GIT_REF pins the worker checkout to the dispatched SHA so §12
# github_sha provenance records the commit actually evaluated.
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: "Hydra experiment used to construct the evaluation model"
        required: true
        type: string
        default: surge/ffn_simple
      checkpoint_ref:
        description: "W&B artifact reference resolved by the worker"
        required: true
        type: string
      dataset_root_uri:
        description: "Finalized Lance dataset consumed by evaluation"
        required: true
        type: string
        default: r2://experiments/data/surge-simple-lance-1k-2k-2k/surge-simple-lance-1k-2k-2k-20260716T163226347Z/
      compute:
        description: "skypilot_launch/compute option"
        required: true
        type: string
        default: runpod/smoke
      tail:
        description: "Tail worker logs and propagate the terminal status"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  evaluate:
    name: Dispatch synth-setter-eval via SkyPilot (${{ inputs.experiment }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CHECKPOINT_REF: ${{ inputs.checkpoint_ref }}
      COMPUTE_OPTION: ${{ inputs.compute }}
      DATASET_ROOT_URI: ${{ inputs.dataset_root_uri }}
      EXPERIMENT: ${{ inputs.experiment }}
      IMAGE: tinaudio/synth-setter:dev-snapshot
      TAIL: ${{ inputs.tail }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate launcher inputs
        run: |
          set -euo pipefail
          if [[ ! "$EXPERIMENT" =~ ^[A-Za-z0-9_./-]+$ ]]; then
            echo "::error::experiment contains unsupported shell characters"
            exit 1
          fi
          if [[ ! "$COMPUTE_OPTION" =~ ^[A-Za-z0-9_./-]+$ ]]; then
            echo "::error::compute contains unsupported shell characters"
            exit 1
          fi
          if [[ ! "$CHECKPOINT_REF" =~ ^[A-Za-z0-9_./+-]+:v[0-9]+$ ]]; then
            echo "::error::checkpoint_ref must name an explicit W&B artifact version"
            exit 1
          fi
          if [[ ! "$DATASET_ROOT_URI" =~ ^r2://[A-Za-z0-9_./-]+$ ]]; then
            echo "::error::dataset_root_uri must be an r2:// URI without shell characters"
            exit 1
          fi

      # Exports canonical storage env plus the rclone projection for the container
      # env pass-through below; rclone itself runs on the SkyPilot worker, not the runner.
      - name: Set up R2
        uses: ./.github/actions/setup-r2
        with:
          access-key-id: ${{ secrets.RCLONE_CONFIG_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.RCLONE_CONFIG_R2_SECRET_ACCESS_KEY }}
          endpoint: ${{ secrets.RCLONE_CONFIG_R2_ENDPOINT }}

      - name: Pull image
        run: docker pull "$IMAGE"

      # python -m uses the mounted checkout rather than image-baked shims.
      - name: Dispatch via SkyPilot
        env:
          SKYPILOT_API_SERVER_ENDPOINT: ${{ secrets.SKYPILOT_API_SERVER_ENDPOINT }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WORKER_GIT_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/home/build/synth-setter" \
            -e SKYPILOT_API_SERVER_ENDPOINT \
            -e RUNPOD_API_KEY \
            -e SYNTH_SETTER_STORAGE_PROVIDER \
            -e SYNTH_SETTER_STORAGE_ACCESS_KEY_ID \
            -e SYNTH_SETTER_STORAGE_SECRET_ACCESS_KEY \
            -e SYNTH_SETTER_STORAGE_ENDPOINT_URL \
            -e RCLONE_CONFIG_R2_TYPE \
            -e RCLONE_CONFIG_R2_PROVIDER \
            -e RCLONE_CONFIG_R2_ACCESS_KEY_ID \
            -e RCLONE_CONFIG_R2_SECRET_ACCESS_KEY \
            -e RCLONE_CONFIG_R2_ENDPOINT \
            -e WANDB_API_KEY \
            -e WORKER_GIT_REF \
            -e CHECKPOINT_REF \
            -e COMPUTE_OPTION \
            -e DATASET_ROOT_URI \
            -e EXPERIMENT \
            -e TAIL \
            "$IMAGE" \
            bash -c '
              set -euo pipefail
              cd /home/build/synth-setter
              python -m synth_setter.pipeline.skypilot_launch \
                "skypilot_launch/compute=$COMPUTE_OPTION" \
                "skypilot_launch.tail=$TAIL" \
                skypilot_launch.worker_image_tag=dev-snapshot \
                "skypilot_launch.cmd=\"exec src/synth_setter/scripts/run-linux-vst-headless.sh synth-setter-eval experiment=$EXPERIMENT ckpt_path='\\\${wandb:$CHECKPOINT_REF}' datamodule.download_dataset_root_uri=$DATASET_ROOT_URI hydra.run.dir=/home/build/synth-setter/eval-run\""
            ' 2>&1 | tee eval-dispatch.log

      - name: Upload dispatch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-dispatch-log
          path: eval-dispatch.log
          if-no-files-found: warn
          retention-days: 7
