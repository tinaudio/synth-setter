# Real-weight MeanAudio parity and Lance-to-EmbeddingPool production coverage.
name: MeanAudio Encoder E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-meanaudio-encoder.yml"
      - "pyproject.toml"
      - "src/synth_setter/configs/conditioning/meanaudio_16k.yaml"
      - "src/synth_setter/data/vst/shapes.py"
      - "src/synth_setter/pipeline/data/add_embeddings.py"
      - "src/synth_setter/pipeline/data/meanaudio.py"
      - "tests/pipeline/data/test_meanaudio_encoder_e2e.py"
      - "uv.lock"
  pull_request:
    paths:
      - ".github/workflows/test-meanaudio-encoder.yml"
      - "pyproject.toml"
      - "src/synth_setter/configs/conditioning/meanaudio_16k.yaml"
      - "src/synth_setter/data/vst/shapes.py"
      - "src/synth_setter/pipeline/data/add_embeddings.py"
      - "src/synth_setter/pipeline/data/meanaudio.py"
      - "tests/pipeline/data/test_meanaudio_encoder_e2e.py"
      - "uv.lock"

concurrency:
  group: meanaudio-encoder-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  meanaudio_encoder_e2e:
    name: MeanAudio 16 kHz VAE parity
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv and Python 3.12.13
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.28"
          enable-cache: true
          python-version: "3.12.13"

      - name: Install dependencies (uv sync --frozen, CPU torch)
        run: uv sync --frozen --extra cpu --no-default-groups --group dev

      - name: Cache MeanAudio weights
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-meanaudio-16k-${{ hashFiles('src/synth_setter/pipeline/data/meanaudio.py') }}

      - name: Run MeanAudio parity and production path
        env:
          PYTEST_SESSION_BUDGET_SECONDS: "2400"
        run: |
          uv run --no-sync pytest \
            -m meanaudio_e2e \
            tests/pipeline/data/test_meanaudio_encoder_e2e.py \
            -vv \
            --cov=src \
            --cov-branch \
            --cov-report=xml

      - name: Upload coverage to Codecov
        if: always() && hashFiles('coverage.xml') != ''
        uses: ./.github/actions/upload-coverage
        with:
          flags: meanaudio-e2e
          token: ${{ secrets.CODECOV_TOKEN }}
